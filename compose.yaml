services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: slide
      POSTGRES_PASSWORD: slide-local-dev
      POSTGRES_DB: slide
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slide -d slide"]
      interval: 2s
      timeout: 3s
      retries: 20
  minio:
    image: cgr.dev/chainguard/minio@sha256:9f0aab4471ebb181be3cfabea21b719303ec583cd9abdb7779f9e53032b844f7
    command: server /data
    environment:
      MINIO_ROOT_USER: slide-local
      MINIO_ROOT_PASSWORD: slide-local-objects
    volumes: [minio:/data]
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:017f9a45640fe29a11fa9c98b22ffe3ff4783114e09c53cc1cba5854a452595f
    depends_on: [minio]
    entrypoint:
      - /usr/bin/bash
      - -ec
      - |
        for ((i=0; i<30; i++)); do
          if /usr/bin/mc mb --ignore-existing slide/slide-snapshots; then
            exit 0
          fi
          sleep 1
        done
        exit 1
    environment:
      MC_HOST_slide: http://slide-local:slide-local-objects@minio:9000
  api:
    image: oven/bun:1.4.5
    working_dir: /slide
    command: bun apps/server/index.ts
    volumes: [".:/slide:ro"]
    ports: ["127.0.0.1:4321:4321"]
    environment:
      SLIDE_HOST: 0.0.0.0
      DATABASE_URL: postgres://slide:slide-local-dev@postgres:5432/slide
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: slide-snapshots
      S3_ACCESS_KEY_ID: slide-local
      S3_SECRET_ACCESS_KEY: slide-local-objects
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
volumes:
  postgres:
  minio:
