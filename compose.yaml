services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: slide
      POSTGRES_PASSWORD: slide-local-dev
      POSTGRES_DB: slide
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slide -d slide"]
      interval: 2s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: slide-local
      MINIO_ROOT_PASSWORD: slide-local-objects
    volumes: [minio:/data]
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for i in $$(seq 1 30); do
          if mc alias set local http://minio:9000 slide-local slide-local-objects; then
            exec mc mb --ignore-existing local/slide-snapshots
          fi
          sleep 1
        done
        exit 1
  api:
    image: oven/bun:1.4.5
    working_dir: /slide
    command: bun apps/server/index.ts
    volumes: [".:/slide:ro"]
    ports: ["127.0.0.1:4321:4321"]
    environment:
      SLIDE_HOST: 0.0.0.0
      DATABASE_URL: postgres://slide:slide-local-dev@postgres:5432/slide
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: slide-snapshots
      S3_ACCESS_KEY_ID: slide-local
      S3_SECRET_ACCESS_KEY: slide-local-objects
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
volumes:
  postgres:
  minio:
