name: Desktop development installers

on:
  pull_request:
  push:
    branches: [main, 'devin/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.target }} unsigned
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifacts: |
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              *.app.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifacts: |
              apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              *.app.tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifacts: |
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run --cwd apps/desktop build
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: bun run --cwd apps/desktop bundle --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - if: runner.os == 'macOS'
        run: tar -czf "Slide Workspaces.app.tar.gz" -C "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos" "Slide Workspaces.app"
      - uses: actions/upload-artifact@v4
        with:
          name: slide-workspaces-${{ matrix.target }}-unsigned
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
